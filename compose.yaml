name: codeconnect

services:
  sqlserver:
    # Imagem oficial do SQL Server 2022 com o Full-Text Search instalado (docker/mssql/Dockerfile).
    build: docker/mssql
    image: codeconnect-mssql-fts
    container_name: codeconnect-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env da raiz}
    ports:
      - '${MSSQL_PORT:-1433}:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mssql-data:
